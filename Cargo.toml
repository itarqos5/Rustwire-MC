[package]
name = "rustwire-mc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Bounded, version-aware Minecraft Java protocol building blocks"
license = "MIT"
repository = "https://github.com/itarqos5/Rustwire-MC"
publish = false

[features]
default = ["compression"]
compression = ["dep:flate2"]
crypto = ["dep:aes", "dep:sha1", "dep:rsa", "dep:rand", "dep:md-5", "dep:zeroize"]
auth = ["crypto", "dep:ureq", "dep:serde_json"]

[dependencies]
flate2 = { version = "1.1", optional = true, default-features = false, features = ["rust_backend"] }
aes = { version = "0.8", optional = true, features = ["zeroize"] }
sha1 = { version = "0.10", optional = true }
rsa = { version = "0.9", optional = true }
rand = { version = "0.8", optional = true }
md-5 = { version = "0.10", optional = true }
zeroize = { version = "1.8", optional = true }
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls", "json"] }
serde_json = { version = "1", optional = true }

[[example]]
name = "online_login"
required-features = ["auth"]

[[bench]]
name = "codec"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "protocol_workloads"
harness = false
