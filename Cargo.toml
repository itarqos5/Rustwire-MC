[package]
name = "rustwire-mc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Bounded, version-aware Minecraft Java protocol building blocks"
license = "MIT"
repository = "https://github.com/itarqos5/Rustwire-MC"
publish = false

[features]
default = ["compression"]
compression = ["dep:flate2"]

[dependencies]
flate2 = { version = "1.1", optional = true, default-features = false, features = ["rust_backend"] }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
